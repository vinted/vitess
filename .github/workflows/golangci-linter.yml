name: golangci-lint
on: [push, pull_request]
jobs:
  build:
    name: Lint using golangci-lint
    runs-on: ubuntu-22.04
    steps:
    - name: Set up Go 1.27.3
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.3
      id: go

    - name: Tune the OS
      run: |
        echo '1024 65535' | sudo tee -a /proc/sys/net/ipv4/ip_local_port_range


    - name: Check out code into the Go module directory
      uses: actions/checkout@v4

    - name: Install golangci-lint
      run: curl -sfL https://raw.githubusercontent.com/golangci/golangci-lint/v1.31.0/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.31.0

    - name: Clean Env
      run: $(go env GOPATH)/bin/golangci-lint cache clean

    - name: Print linter version
      run: $(go env GOPATH)/bin/golangci-lint --version

    - name: Run golangci-lint
      run: $(go env GOPATH)/bin/golangci-lint run go/...
