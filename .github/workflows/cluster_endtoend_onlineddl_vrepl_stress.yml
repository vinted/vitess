# DO NOT MODIFY: THIS FILE IS GENERATED USING "make generate_ci_workflows"

name: Cluster (onlineddl_vrepl_stress)
on: [workflow_dispatch]
jobs:

  build:
    name: Run endtoend tests on Cluster (onlineddl_vrepl_stress)
    runs-on: ubuntu-22.04

    steps:
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.27.3

    - name: Tune the OS
      run: |
        echo '1024 65535' | sudo tee -a /proc/sys/net/ipv4/ip_local_port_range
        # The test clusters listen on fixed ports in this range. Keep them out
        # of the (widened) ephemeral range so that an outgoing connection can
        # never grab a port that mysqld or a vttablet is about to bind.
        sudo sysctl -w net.ipv4.ip_local_reserved_ports=6700-35000

    - name: Check out code
      uses: actions/checkout@v4

    - name: Get dependencies
      run: |
        export DEBIAN_FRONTEND="noninteractive"
        sudo apt-get update
        sudo apt-get install -y mysql-server mysql-client make unzip g++ etcd curl git wget eatmydata
        sudo service mysql stop
        sudo service etcd stop
        sudo bash -c "echo '/usr/sbin/mysqld { }' > /etc/apparmor.d/usr.sbin.mysqld" # https://bugs.launchpad.net/ubuntu/+source/mariadb-10.1/+bug/1806263
        sudo ln -s /etc/apparmor.d/usr.sbin.mysqld /etc/apparmor.d/disable/
        sudo apparmor_parser -R /etc/apparmor.d/usr.sbin.mysqld || echo "could not remove mysqld profile"
        go mod download

    - name: Run cluster endtoend test
      timeout-minutes: 30
      run: |
        source build.env
        eatmydata -- go run test.go -docker=false -print-log -follow -shard onlineddl_vrepl_stress
