name: build_binaries
on:
  push:
    branches:
      - 'vinted/**'
  workflow_dispatch:

jobs:
  build:
    name: Build linux/amd64 binaries
    runs-on: ubuntu-22.04
    steps:

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.16

    - name: Check out code
      uses: actions/checkout@v4
      with:
        # Needed by tools/build_version_flags.sh to embed the git revision and
        # branch (shown by `vtgate -version` and on /debug/vars).
        fetch-depth: 0

    - name: Build
      run: |
        go mod download
        make build
        ls -la bin/

    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: vitess-linux-amd64-${{ github.sha }}
        path: bin/
        retention-days: 30
        if-no-files-found: error
